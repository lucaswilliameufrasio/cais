<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cais — gestão de bancos</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">

  <section id="view-unlock" class="view hidden">
    <form id="unlock-form" class="auth-box">
      <h1>cais</h1>
      <p id="unlock-subtitle">Digite a senha mestra para desbloquear o cofre.</p>
      <label>
        Senha mestra
        <input id="field-password" type="password" autocomplete="current-password" required>
      </label>
      <label id="field-confirm-wrap" class="hidden">
        Confirmar senha
        <input id="field-confirm" type="password" autocomplete="new-password">
      </label>
      <button type="submit" id="unlock-submit">Desbloquear</button>
      <p id="unlock-error" class="error hidden"></p>
    </form>
  </section>

  <section id="view-dashboard" class="view hidden">
    <header class="topbar">
      <h1>cais</h1>
      <div class="topbar-actions">
        <button id="btn-migrate" class="ghost">Migrar</button>
        <button id="btn-backup" class="ghost">Backup</button>
        <button id="btn-restore" class="ghost">Restaurar</button>
        <button id="btn-backups" class="ghost">Backups</button>
        <button id="btn-add-instance" class="primary">+ Instância</button>
        <button id="btn-lock" class="danger">Bloquear</button>
      </div>
    </header>
    <p id="status-bar" class="status"></p>
    <p id="totals" class="totals"></p>
    <div class="inst-toolbar">
      <input id="instance-filter" type="search" placeholder="Filtrar por nome da instância ou host..." autocomplete="off">
      <div id="inst-pagination" class="pagination"></div>
    </div>
    <div id="instance-cards" class="cards"></div>
  </section>

  <section id="view-backups" class="view hidden">
    <header class="topbar">
      <button id="back-to-dashboard" class="ghost">&larr; Dashboard</button>
      <h1>Backups</h1>
      <div class="topbar-actions">
        <button id="btn-refresh-backups" class="ghost">Atualizar</button>
      </div>
    </header>
    <p id="status-bar" class="status"></p>
    <table class="table">
      <thead>
        <tr><th>Arquivo</th><th>Tamanho</th><th>Modificado</th><th></th></tr>
      </thead>
      <tbody id="backups-tbody"></tbody>
    </table>
    <p id="backups-empty" class="empty hidden">Nenhum backup encontrado.</p>
  </section>

  <section id="view-query" class="view hidden">
    <header class="topbar">
      <button id="query-back" class="ghost">&larr; Dashboard</button>
      <h1>Consultar</h1>
      <div class="topbar-actions">
        <select id="query-instance" title="Instância"></select>
        <select id="query-source" title="Conexão"></select>
      </div>
    </header>
    <p id="status-bar" class="status"></p>
    <div class="query-layout">
      <aside class="query-sidebar">
        <input id="query-table-filter" type="search" placeholder="Filtrar tabelas..." autocomplete="off">
        <div id="query-tables" class="query-tables"></div>
      </aside>
      <div class="query-main">
        <div class="query-tabs">
          <button id="tab-data" class="ghost active" type="button">Data</button>
          <button id="tab-sql" class="ghost" type="button">SQL</button>
        </div>
        <div id="query-data-pane" class="query-pane">
          <p id="query-data-title" class="hint">Selecione uma tabela na lateral.</p>
          <div id="query-data-wrap" class="query-grid-wrap">
            <table class="table" id="query-data-table"></table>
          </div>
        </div>
        <div id="query-sql-pane" class="query-pane hidden">
          <textarea id="query-sql-input" class="mono" rows="6" placeholder="SELECT ..."></textarea>
          <div class="query-sql-actions">
            <label class="check-row">
              <input id="query-read-only" type="checkbox" checked>
              <span>Somente leitura</span>
            </label>
            <button id="query-run" class="primary" type="button">Executar (Ctrl+Enter)</button>
          </div>
          <p id="query-sql-status" class="query-status"></p>
          <div id="query-result-wrap" class="query-grid-wrap">
            <table class="table" id="query-result-table"></table>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div id="modal-overlay" class="overlay hidden">
    <div id="modal" class="modal">
      <button id="modal-close" class="close" aria-label="Fechar">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="loading-overlay" class="overlay hidden" aria-live="polite">
    <div class="loading-box">
      <span class="spinner" aria-hidden="true"></span>
      <span id="loading-text">Carregando...</span>
    </div>
  </div>

</div>
<script src="/app.js"></script>
</body>
</html>
