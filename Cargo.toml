[package]
name = "cais"
version = "0.1.0"
edition = "2024"
default-run = "cais"
repository = "https://github.com/lucaswilliameufrasio/cais"
authors = ["Lucas Eufrasio"]
license = "MIT"

[features]

[profile.dist]
inherits = "release"
lto = "thin"

[dependencies]
anyhow = "1.0.102"
axum = "0.8.9"
argon2 = "0.5.3"
aws-lc-rs = "1.17.0"
base64 = "0.22.1"
chrono = "0.4.45"
crossterm = "0.29.0"
directories = "6.0.0"
percent-encoding = "2.3.2"
postgres = "0.19.14"
ratatui = "0.30.1"
regex = "1.12.4"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
url = "2.5.8"
tempfile = "3.23.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
uuid = { version = "1.18.1", features = ["v7"] }
zeroize = "1.8.2"

[dev-dependencies]
http-body-util = "0.1"
testcontainers = { version = "0.28.0", features = ["blocking"] }
tower = { version = "0.5", features = ["util"] }
