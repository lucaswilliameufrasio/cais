[package]
name = "cais"
version = "0.4.0"
edition = "2024"
default-run = "cais"
repository = "https://github.com/lucaswilliameufrasio/cais"
authors = ["Lucas Eufrasio"]
license = "MIT"

[features]

[profile.dist]
inherits = "release"
lto = "thin"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
argon2 = "0.6.0"
aws-lc-rs = "1.19.0"
base64 = "0.23.1"
chrono = "0.4.45"
crossterm = "0.29.0"
directories = "6.0.0"
percent-encoding = "2.3.2"
postgres = "0.19.14"
ratatui = "0.30.2"
regex = "1.13.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
url = "2.5.8"
tempfile = "3.27.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
uuid = { version = "1.29.0", features = ["v7"] }
zeroize = "1.9.1"

[dev-dependencies]
http-body-util = "0.1"
testcontainers = { version = "0.28.0", features = ["blocking"] }
tower = { version = "0.5", features = ["util"] }
