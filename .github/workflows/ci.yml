name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - 'cliff.toml'
      - 'dist-workspace.toml'
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - 'cliff.toml'
      - 'dist-workspace.toml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  RUSTFLAGS: -D warnings
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check

      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  build-and-test:
    name: Build and test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Set temp directory on Windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          mkdir -p "D:\a\_temp"
          echo "TEMP=D:\a\_temp" >> $GITHUB_ENV
          echo "TMP=D:\a\_temp" >> $GITHUB_ENV
        shell: bash

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --locked --all-targets

      - run: cargo test --locked --lib

      - name: Web API tests
        run: cargo test --locked --test web_api

      - name: Build docs
        run: cargo doc --locked --no-deps

  integration:
    name: Integration (Docker)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install AWS CLI for S3 E2E tests
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg unzip
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt noble-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          curl -fsSL https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --update

      - name: Run PostgreSQL and S3 integration tests
        run: RUN_DOCKER_TESTS=1 cargo test --locked --test postgres_integration --test headless_integration -- --test-threads=1

  coverage:
    name: Coverage (with Docker tests)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Run all tests under coverage (unit + HTTP + Docker integration)
        env:
          RUN_DOCKER_TESTS: "1"
        run: |
          mkdir -p target/llvm-cov
          cargo llvm-cov --locked --workspace --all-features \
            --lcov --output-path target/llvm-cov/lcov.info \
            -- --test-threads=4 2>&1 | tee target/llvm-cov/output.txt

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "## Coverage (unit + HTTP + Docker integration)"
            echo '```'
            grep "TOTAL" target/llvm-cov/output.txt || tail -n 8 target/llvm-cov/output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lcov artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: target/llvm-cov/lcov.info
