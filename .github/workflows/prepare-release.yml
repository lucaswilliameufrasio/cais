name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0 or v0.1.0)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-prep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Validate version format
        id: version-check
        run: |
          RAW="${{ inputs.version }}"
          CLEAN="$(echo "$RAW" | sed 's/^v//')"
          echo "version=$CLEAN" >> "$GITHUB_OUTPUT"
          if ! echo "$CLEAN" | grep -qP '^\d+\.\d+\.\d+$'; then
            echo "error: version must be semver format (e.g., 0.1.0 or v0.1.0)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate changelog for release
        env:
          V: ${{ steps.version-check.outputs.version }}
        run: |
          git cliff --bump --tag "v$V" -o CHANGELOG.md

      - name: Update version in Cargo.toml
        env:
          V: ${{ steps.version-check.outputs.version }}
        run: |
          sed -i "s/^version = \".*\"/version = \"$V\"/" Cargo.toml

      - name: Regenerate Cargo.lock after version bump
        run: cargo generate-lockfile

      - name: Create release PR via gh CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.version-check.outputs.version }}
          BRANCH: release/v${{ steps.version-check.outputs.version }}-rc.${{ github.run_attempt }}
          TITLE: Release v${{ steps.version-check.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add CHANGELOG.md Cargo.toml Cargo.lock
          git commit -m "chore(release): prepare for v$V"

          git push origin HEAD:"$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body "Automated release preparation for **v$V**.

## After merging

Pull latest main, then create and push the tag:

```bash
git checkout main && git pull --rebase
git tag v$V && git push origin v$V
```

The `Release` workflow will build artifacts and create the GitHub Release."
